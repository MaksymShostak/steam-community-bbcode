# Native update proposals; latest-first selection does not mean automatic approval.
version: 2
multi-ecosystem-groups:
  repository-version-updates:
    schedule:
      interval: daily
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /comparison/bbob
    patterns: ["*"]
    multi-ecosystem-group: repository-version-updates
    cooldown:
      default-days: 0
  - package-ecosystem: npm
    directories:
      - /tooling/type-coverage
      - /tooling/api-docs
    # These API-consuming tools retain the approved TypeScript 6 boundary.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0"]
    patterns: ["*"]
    multi-ecosystem-group: repository-version-updates
    cooldown:
      default-days: 0
  - package-ecosystem: npm
    directory: /tooling/node-types/22
    patterns: ["*"]
    multi-ecosystem-group: repository-version-updates
    ignore:
      - dependency-name: "@types/node"
        versions: ["<22.0.0", ">=23.0.0"]
  - package-ecosystem: npm
    directory: /tooling/node-types/24
    patterns: ["*"]
    multi-ecosystem-group: repository-version-updates
    ignore:
      - dependency-name: "@types/node"
        versions: ["<24.0.0", ">=25.0.0"]
  - package-ecosystem: npm
    directory: /tooling/node-types/26
    patterns: ["*"]
    multi-ecosystem-group: repository-version-updates
    ignore:
      - dependency-name: "@types/node"
        versions: ["<26.0.0", ">=27.0.0"]
  - package-ecosystem: pip
    directories:
      - /tooling/prose
    patterns: ["*"]
    multi-ecosystem-group: repository-version-updates
    cooldown:
      default-days: 0
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: repository-version-updates
    cooldown:
      default-days: 0
