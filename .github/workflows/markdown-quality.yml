# Adapted from Hadden-Industries/owlapi at 4f6adbd3a925ad2e0ccfc98550f216642957f870.
name: Trusted Markdown qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_repository:
        description: Public candidate repository; content is inspected only as data
        required: true
        default: MaksymShostak/steam-community-bbcode
        type: string
      candidate_sha:
        description: Exact 40-character candidate commit to qualify
        required: true
        type: string

permissions: {}

jobs:
  shadow_bootstrap:
    name: Markdown shadow bootstrap / ${{ matrix.os }}
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install the isolated shadow graph without lifecycle scripts
        run: npm --prefix tooling/markdown ci --ignore-scripts --no-audit --no-fund
      - name: Exercise native integration and candidate isolation fixtures
        run: node --test tooling/markdown/integration.test.mjs scripts/check-markdown-candidate.probes.mjs
  markdown_linux:
    if: github.event_name == 'workflow_dispatch'
    name: Trusted Markdown / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Select the qualified Node runtime without shared caches
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Select the pinned resource observer Python
        id: markdown_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          architecture: x64
          check-latest: false
          update-environment: false
          cache: ""
      - name: Acquire only the trusted isolated graph without credentials or lifecycle scripts
        working-directory: trusted/tooling/markdown
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          touch "$RUNNER_TEMP/markdown-user.npmrc" "$RUNNER_TEMP/markdown-global.npmrc"
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ --userconfig="$RUNNER_TEMP/markdown-user.npmrc" --globalconfig="$RUNNER_TEMP/markdown-global.npmrc" --cache="$RUNNER_TEMP/markdown-npm-cache"
      - name: Check out the exact candidate separately as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.candidate_repository }}
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Run trusted staging negative probes
        env:
          MARKDOWN_TEST_CLI: ${{ github.workspace }}/trusted/tooling/markdown/node_modules/@hadden-industries/markdown-quality/src/cli.js
        run: node --test trusted/scripts/check-markdown-candidate.probes.mjs
      - name: Observe six consecutive full checks and platform resources
        env:
          MARKDOWN_OBSERVER_PYTHON: ${{ steps.markdown_python.outputs.python-path }}
          MARKDOWN_CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          MARKDOWN_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MARKDOWN_TRUSTED_SHA: ${{ github.workflow_sha }}
        run: node trusted/scripts/run-markdown-window.mjs
      - name: Report trusted window and every available sample
        if: ${{ !cancelled() }}
        env:
          EVIDENCE_OUTCOME: ${{ job.status }}
        run: npm --prefix trusted run generate:ci-evidence -- --mode trusted-markdown --window-directory "$RUNNER_TEMP/markdown-window"
  markdown_windows:
    if: github.event_name == 'workflow_dispatch'
    name: Trusted Markdown / Windows
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Select the qualified Node runtime without shared caches
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Select the pinned resource observer Python
        id: markdown_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          architecture: x64
          check-latest: false
          update-environment: false
          cache: ""
      - name: Acquire only the trusted isolated graph without credentials or lifecycle scripts
        working-directory: trusted/tooling/markdown
        env:
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          $markdownUserConfig = Join-Path $env:RUNNER_TEMP 'markdown-user.npmrc'
          $markdownGlobalConfig = Join-Path $env:RUNNER_TEMP 'markdown-global.npmrc'
          $markdownCache = Join-Path $env:RUNNER_TEMP 'markdown-npm-cache'
          Set-Content -LiteralPath $markdownUserConfig -Value '' -Encoding utf8NoBOM
          Set-Content -LiteralPath $markdownGlobalConfig -Value '' -Encoding utf8NoBOM
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ "--userconfig=$markdownUserConfig" "--globalconfig=$markdownGlobalConfig" "--cache=$markdownCache"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check out the exact candidate separately as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.candidate_repository }}
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Run trusted staging negative probes
        env:
          MARKDOWN_TEST_CLI: ${{ github.workspace }}/trusted/tooling/markdown/node_modules/@hadden-industries/markdown-quality/src/cli.js
        run: node --test trusted/scripts/check-markdown-candidate.probes.mjs
      - name: Observe six consecutive full checks and platform resources
        env:
          MARKDOWN_OBSERVER_PYTHON: ${{ steps.markdown_python.outputs.python-path }}
          MARKDOWN_CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          MARKDOWN_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MARKDOWN_TRUSTED_SHA: ${{ github.workflow_sha }}
        run: node trusted/scripts/run-markdown-window.mjs
      - name: Report trusted window and every available sample
        if: ${{ !cancelled() }}
        env:
          EVIDENCE_OUTCOME: ${{ job.status }}
        run: npm --prefix trusted run generate:ci-evidence -- --mode trusted-markdown --window-directory "$env:RUNNER_TEMP/markdown-window"
