name: Trusted Markdown qualification

on:
  workflow_dispatch:
    inputs:
      trusted_sha:
        description: Reviewed 40-character Steam Community BBCode bootstrap commit accepted by the owner
        required: true
        type: string
      candidate_repository:
        description: Public candidate repository; content is inspected only as data
        required: true
        default: MaksymShostak/steam-community-bbcode
        type: string
      candidate_sha:
        description: Exact 40-character candidate commit to qualify
        required: true
        type: string

permissions: {}

jobs:
  markdown:
    permissions:
      contents: read
    uses: Hadden-Industries/markdown-quality/.github/workflows/markdown-quality.yml@482126f52802e1479c00caf1c9fdf9ad7d856aa9
    with:
      trusted-repository: MaksymShostak/steam-community-bbcode
      trusted-sha: ${{ inputs.trusted_sha }}
      candidate-repository: ${{ inputs.candidate_repository }}
      candidate-sha: ${{ inputs.candidate_sha }}
      profile: .markdown-quality-execution.json
