name: SDLC control tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdlc-controls-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  controls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - name: Create repository interpreter
        run: python -m venv .venv
      - name: Install locked lifecycle dependencies
        run: npm exec --yes --package=npm@12.0.2 -- npm run setup:sdlc:dependencies
      - name: Verify preserved lifecycle contracts
        run: npm exec --yes --package=npm@12.0.2 -- npm run test:sdlc
      - name: Verify native setup preservation
        run: npm exec --yes --package=npm@12.0.2 -- npm run test:setup
      - name: Generate and verify repository-local configuration
        run: |
          npm exec --yes --package=npm@12.0.2 -- npm run setup:sdlc
          npm exec --yes --package=npm@12.0.2 -- npm run check:sdlc
  required:
    name: SDLC controls
    if: always()
    needs: [controls]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require successful control matrix
        env:
          CONTROL_RESULT: ${{ needs.controls.result }}
        run: test "$CONTROL_RESULT" = success
