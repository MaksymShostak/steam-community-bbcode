name: Steam Community BBCode checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      force-package:
        description: Explicit reusable qualification always constructs the package
        type: boolean
        default: true
      run-mutation:
        description: Require both mutation profiles for candidate qualification
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      force-package:
        description: Explicit qualification always constructs the package
        type: boolean
        default: true
      run-mutation:
        description: Run both mutation profiles in addition to iteration checks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  selection:
    name: Select qualification from exact Git inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package-required: ${{ steps.selection.outputs.package-required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Record conservative selection
        id: selection
        env:
          FORCE_PACKAGE: ${{ inputs.force-package == true }}
        run: npm run qualify:ci-selection
  converter:
    name: BBCode / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: [selection, dependency-review]
    if: needs.selection.outputs.package-required == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22.22.2, 24.15.0, 26.11.1, 22.x, 24.x, 26.x]
        include:
          - node: 22.22.2
            nodeTypes: "22"
          - node: 24.15.0
            nodeTypes: "24"
          - node: 26.11.1
            nodeTypes: "26"
          - node: 22.x
            nodeTypes: "22"
          - node: 24.x
            nodeTypes: "24"
          - node: 26.x
            nodeTypes: "26"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Exercise standalone development setup
        run: npm exec --yes --package=npm@12.2.0 -- npm run set-up:development -- --product-only
      - name: Generate locked dependency inventories
        run: |
          node --input-type=module -e "import {mkdirSync} from 'node:fs'; mkdirSync('artifacts/supply-chain', {recursive: true});"
          npm exec --yes --package=npm@12.2.0 -- npm run --silent generate:sbom > artifacts/supply-chain/package.cdx.json
          npm exec --yes --package=npm@12.2.0 -- npm run --silent generate:sbom:type-coverage > artifacts/supply-chain/type-coverage.cdx.json
          npm exec --yes --package=npm@12.2.0 -- npm run --silent generate:sbom:api-docs > artifacts/supply-chain/api-docs.cdx.json
      - name: Check the converter and real packed consumer
        run: npm exec --yes --package=npm@12.2.0 -- npm run check:product
      - name: Qualify matching Node declarations and the retained archive
        env:
          NODE_TYPES_MAJOR: ${{ matrix.nodeTypes }}
        run: npm exec --yes --package=npm@12.2.0 -- npm run qualify:node-types -- --major "$NODE_TYPES_MAJOR"
        shell: bash
      - name: Report converter qualification
        if: ${{ !cancelled() }}
        env:
          EVIDENCE_OUTCOME: ${{ job.status }}
          EVIDENCE_LANE: ${{ matrix.os }} / Node ${{ matrix.node }}
        run: npm run generate:ci-evidence -- --mode converter
  markdown:
    name: BBCode / Markdown / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install only the isolated Markdown graph and standard-library observer environment
        run: |
          npm exec --yes --package=npm@12.2.0 -- npm run install:markdown
          python -m venv .venv
      - name: Test the native integration and staging boundaries
        run: npm exec --yes --package=npm@12.2.0 -- npm run test:markdown
      - name: Test the public trusted qualification integration
        run: npm exec --yes --package=npm@12.2.0 -- npm run test:markdown:qualification
      - name: Check all authored Markdown, including target-only changes
        run: npm exec --yes --package=npm@12.2.0 -- npm run check:markdown
      - name: Report the fresh native Markdown result and stderr
        if: ${{ !cancelled() }}
        env:
          EVIDENCE_OUTCOME: ${{ job.status }}
          EVIDENCE_LANE: ${{ matrix.os }}
        run: npm run generate:ci-evidence -- --mode markdown
  consumer-archive:
    name: Build consumer qualification archive
    needs: [selection, dependency-review]
    if: needs.selection.outputs.package-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm exec --yes --package=npm@12.2.0 -- npm ci --ignore-scripts
      - run: npm exec --yes --package=npm@12.2.0 -- npm run test:package
      - name: Report archive qualification
        if: ${{ !cancelled() }}
        env:
          EVIDENCE_OUTCOME: ${{ job.status }}
        run: npm run generate:ci-evidence -- --mode archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bbcode-consumer-archive
          path: artifacts/steam-community-bbcode-*.tgz
          if-no-files-found: error
          retention-days: 7
  consumers:
    needs: [selection, consumer-archive]
    if: needs.selection.outputs.package-required == 'true'
    uses: ./.github/workflows/node-consumers.yml
    with:
      artifact: bbcode-consumer-archive
  mutation:
    name: BBCode / Mutation / ${{ matrix.profile }}
    if: ${{ needs.selection.outputs.package-required == 'true' && inputs.run-mutation == true }}
    needs: [selection, converter]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [library, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Install locked converter development dependencies
        run: npm exec --yes --package=npm@12.2.0 -- npm ci --ignore-scripts
      - name: Qualify mutation sensitivity
        env:
          MUTATION_PROFILE: ${{ matrix.profile }}
        run: npm exec --yes --package=npm@12.2.0 -- npm run "test:mutation:$MUTATION_PROFILE"
      - name: Report mutation qualification
        if: ${{ !cancelled() }}
        env:
          EVIDENCE_OUTCOME: ${{ job.status }}
          MUTATION_PROFILE: ${{ matrix.profile }}
        shell: bash
        run: npm run generate:ci-evidence -- --mode mutation --profile "$MUTATION_PROFILE"
  qualification:
    name: BBCode / Qualification
    needs:
      [
        selection,
        dependency-review,
        converter,
        consumer-archive,
        mutation,
        consumers,
        markdown,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require iteration checks and the requested mutation result
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          PACKAGE_REQUIRED: ${{ needs.selection.outputs.package-required }}
          ARCHIVE_RESULT: ${{ needs.consumer-archive.result }}
          MUTATION_REQUIRED: ${{ inputs.run-mutation == true }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          CHECK_RESULT: ${{ needs.converter.result }}
          CONSUMER_RESULT: ${{ needs.consumers.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
          MARKDOWN_RESULT: ${{ needs.markdown.result }}
        run: |
          test "$DEPENDENCY_REVIEW_RESULT" = success
          test "$SELECTION_RESULT" = success
          test "$MARKDOWN_RESULT" = success
          case "$PACKAGE_REQUIRED" in
            true)
              test "$CHECK_RESULT" = success
              test "$ARCHIVE_RESULT" = success
              test "$CONSUMER_RESULT" = success
              case "$MUTATION_REQUIRED" in
                true) test "$MUTATION_RESULT" = success ;;
                false) test "$MUTATION_RESULT" = skipped ;;
                *) exit 1 ;;
              esac
              ;;
            false)
              test "$CHECK_RESULT" = skipped
              test "$ARCHIVE_RESULT" = skipped
              test "$CONSUMER_RESULT" = skipped
              test "$MUTATION_RESULT" = skipped
              ;;
            *) exit 1 ;;
          esac
  dependency-review:
    name: BBCode / Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Review introduced dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never
