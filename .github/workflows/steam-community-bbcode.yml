name: Steam Community BBCode checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      force-package:
        description: Explicit reusable qualification always constructs the package
        type: boolean
        default: true
      run-mutation:
        description: Require both mutation profiles for candidate qualification
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      force-package:
        description: Explicit qualification always constructs the package
        type: boolean
        default: true
      run-mutation:
        description: Run both mutation profiles in addition to iteration checks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  selection:
    name: Select qualification from exact Git inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package-required: ${{ steps.selection.outputs.package-required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/setup-npm
      - name: Record conservative selection
        id: selection
        env:
          FORCE_PACKAGE: ${{ inputs.force-package == true }}
        run: npm run qualify:ci-selection
  converter:
    name: BBCode / ${{ matrix.os }} / Node ${{ matrix.node.version || format('{0} reference', matrix.node.major) }}
    needs: [selection, dependency-review, markdown]
    if: needs.selection.outputs.package-required == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node:
          - { version: "22.22.2", major: "22" }
          - { version: "24.15.0", major: "24" }
          - { version: "26.11.1", major: "26" }
          - { file: .github/node-versions/22, major: "22" }
          - { file: .github/node-versions/24, major: "24" }
          - { file: .node-version, major: "26" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node.version }}
          node-version-file: ${{ matrix.node.file }}
          package-manager-cache: false
      - uses: ./.github/actions/setup-npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          activate-environment: true
          venv-path: ${{ runner.temp }}/python
          no-project: true
          enable-cache: false
      - name: Exercise standalone development setup
        run: npm run set-up:development
      - name: Generate locked dependency inventories
        run: |
          node --input-type=module -e "import {mkdirSync} from 'node:fs'; mkdirSync('artifacts/supply-chain', {recursive: true});"
          npm run --silent generate:sbom > artifacts/supply-chain/package.cdx.json
          npm run --silent generate:sbom:type-coverage > artifacts/supply-chain/type-coverage.cdx.json
          npm run --silent generate:sbom:api-docs > artifacts/supply-chain/api-docs.cdx.json
      - name: Check the converter and real packed consumer
        run: npm run check:product
      - name: Qualify matching Node declarations and the retained archive
        env:
          NODE_TYPES_MAJOR: ${{ matrix.node.major }}
        run: npm run qualify:node-types -- --major "$NODE_TYPES_MAJOR"
        shell: bash
      - name: Report converter qualification
        if: ${{ !cancelled() }}
        env:
          EVIDENCE_OUTCOME: ${{ job.status }}
          EVIDENCE_LANE: ${{ matrix.os }} / Node ${{ matrix.node.version || format('{0} reference', matrix.node.major) }}
        run: npm run generate:ci-evidence -- --mode converter
  markdown:
    name: BBCode / Markdown / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select the pinned npm CLI
        uses: ./.github/actions/setup-npm
      - name: Install the locked root graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check all authored Markdown, including target-only changes
        shell: bash
        run: |
          markdown_stop_token="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          trap 'markdown_status=$?; printf "\n::%s::\n" "$markdown_stop_token"; exit "$markdown_status"' EXIT
          printf '::stop-commands::%s\n' "$markdown_stop_token"
          npm run --silent check:markdown 2>&1
      - name: Test the public Markdown integration
        run: npm run test:markdown
  consumer-archive:
    name: Build consumer qualification archive
    needs: [selection, dependency-review, markdown]
    if: needs.selection.outputs.package-required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/setup-npm
      - run: npm ci --ignore-scripts
      - run: npm run test:package
      - name: Report archive qualification
        if: ${{ !cancelled() }}
        env:
          EVIDENCE_OUTCOME: ${{ job.status }}
        run: npm run generate:ci-evidence -- --mode archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bbcode-consumer-archive
          path: artifacts/steam-community-bbcode-*.tgz
          if-no-files-found: error
          retention-days: 7
  consumers:
    needs: [selection, consumer-archive]
    if: needs.selection.outputs.package-required == 'true'
    uses: ./.github/workflows/node-consumers.yml
    with:
      artifact: bbcode-consumer-archive
  mutation:
    name: BBCode / Mutation / ${{ matrix.profile }}
    if: ${{ needs.selection.outputs.package-required == 'true' && inputs.run-mutation == true }}
    needs: [selection, converter]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [library, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/setup-npm
      - name: Install locked converter development dependencies
        run: npm ci --ignore-scripts
      - name: Qualify mutation sensitivity
        env:
          MUTATION_PROFILE: ${{ matrix.profile }}
        run: npm run "test:mutation:$MUTATION_PROFILE"
      - name: Report mutation qualification
        if: ${{ !cancelled() }}
        env:
          EVIDENCE_OUTCOME: ${{ job.status }}
          MUTATION_PROFILE: ${{ matrix.profile }}
        shell: bash
        run: npm run generate:ci-evidence -- --mode mutation --profile "$MUTATION_PROFILE"
  qualification:
    name: BBCode / Qualification
    needs:
      [
        selection,
        dependency-review,
        converter,
        consumer-archive,
        mutation,
        consumers,
        markdown,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require iteration checks and the requested mutation result
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          PACKAGE_REQUIRED: ${{ needs.selection.outputs.package-required }}
          ARCHIVE_RESULT: ${{ needs.consumer-archive.result }}
          MUTATION_REQUIRED: ${{ inputs.run-mutation == true }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          CHECK_RESULT: ${{ needs.converter.result }}
          CONSUMER_RESULT: ${{ needs.consumers.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
          MARKDOWN_RESULT: ${{ needs.markdown.result }}
        run: |
          test "$DEPENDENCY_REVIEW_RESULT" = success
          test "$SELECTION_RESULT" = success
          test "$MARKDOWN_RESULT" = success
          case "$PACKAGE_REQUIRED" in
            true)
              test "$CHECK_RESULT" = success
              test "$ARCHIVE_RESULT" = success
              test "$CONSUMER_RESULT" = success
              case "$MUTATION_REQUIRED" in
                true) test "$MUTATION_RESULT" = success ;;
                false) test "$MUTATION_RESULT" = skipped ;;
                *) exit 1 ;;
              esac
              ;;
            false)
              test "$CHECK_RESULT" = skipped
              test "$ARCHIVE_RESULT" = skipped
              test "$CONSUMER_RESULT" = skipped
              test "$MUTATION_RESULT" = skipped
              ;;
            *) exit 1 ;;
          esac
  dependency-review:
    name: BBCode / Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Review introduced dependencies
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never
