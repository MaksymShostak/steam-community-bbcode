name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "52 16 * * 0"
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - name: Check out the source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          tools: linked
      - name: Analyze source
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          upload: ${{ matrix.language == 'javascript-typescript' && 'failure-only' || 'always' }}
      - name: Preserve unfiltered JavaScript results
        if: ${{ !cancelled() && matrix.language == 'javascript-typescript' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-unfiltered-javascript-${{ github.run_attempt }}
          path: sarif-results/javascript.sarif
          if-no-files-found: error
      # Owner-approved temporary exception: LinkifyIt.match consumes text, not a regex.
      # Remove when https://github.com/github/codeql/issues/22546 is fixed in our bundle
      # and an unfiltered scan of this test confirms the false positive is absent.
      # Scope includes any finding from this rule in this one test file.
      - name: Filter confirmed LinkifyIt false positive
        if: ${{ matrix.language == 'javascript-typescript' }}
        uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1; Apache-2.0
        with:
          patterns: -test/link-recognition-qualification.test.js:js/incomplete-hostname-regexp
          input: sarif-results/javascript.sarif
          output: sarif-results/javascript.filtered.sarif
      - name: Upload filtered JavaScript results
        if: ${{ matrix.language == 'javascript-typescript' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: sarif-results/javascript.filtered.sarif
          category: /language:javascript-typescript
          wait-for-processing: true
