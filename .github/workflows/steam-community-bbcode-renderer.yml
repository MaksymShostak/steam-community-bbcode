name: Steam Community BBCode renderer conformance
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  renderer:
    name: BBCode / GitHub renderer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Install locked converter runtime dependencies
        run: npm exec --yes --package=npm@12.2.0 -- npm ci --omit=dev --ignore-scripts
      - name: Verify selected GitHub rendering contracts
        id: renderer
        run: npm exec --yes --package=npm@12.2.0 -- npm run qualify:github
      - name: Report current renderer observations
        if: ${{ !cancelled() }}
        env:
          EVIDENCE_OUTCOME: ${{ job.status }}
          EVIDENCE_DIRECTORY: ${{ steps.renderer.outputs.evidence-directory }}
        shell: bash
        run: npm run generate:ci-evidence -- --mode renderer --renderer-directory "$EVIDENCE_DIRECTORY"
